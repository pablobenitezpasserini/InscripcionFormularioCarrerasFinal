<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">

            <!-- Banner -->
            <img src="../IMG/banner.jpg" alt="Banner principal" class="banner img-fluid">

            <h2 class="mb-3">Agregar formulario</h2>

            <hr>

            <p class="text-secondary mb-4">
                Completá los datos para registrar un nuevo formulario de habilitación.
            </p>

            <div id="mensaje" class="mb-3" role="alert" hidden></div>

            <form id="formularioCrear">
                <div class="mb-3">
                    <label for="anio" class="form-label">Año</label>
                    <input type="number" class="form-control" id="anio" name="anio" min="1" step="1" required>
                </div>

                <div class="mb-3">
                    <label for="fechaInicio" class="form-label">
                        Fecha de inicio
                    </label>
                    <input type="date" class="form-control" id="fechaInicio" name="fechaInicio" required>
                </div>

                <div class="mb-4">
                    <label for="fechaCierre" class="form-label">
                        Fecha de cierre
                    </label>
                    <input type="date" class="form-control" id="fechaCierre" name="fechaCierre" required>
                </div>

                <hr class="my-4">

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                    <a href="./index.html" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" id="botonGuardar" class="btn btn-success">
                        Guardar formulario
                    </button>
                </div>
            </form>

        </div>
    </main>
    <!-- Protección de la página -->
    <script type="module">
        import { protegerPagina } from "../js/auth.js";

        protegerPagina();
    </script>
    <script type="module" src="../JS/formularios/crear.js"></script>
</body>

</html>
