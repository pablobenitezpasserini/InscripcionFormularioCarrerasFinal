<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios de habilitación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/formularios/formularios.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">

            <!-- Banner -->
            <img src="../IMG/banner.jpg" alt="Banner principal" class="banner img-fluid">

            <h2 class="mb-3">Formularios de habilitación</h2>

            <hr>

            <p class="text-secondary mb-4">
                Listado de formularios registrados en el sistema.
            </p>

            <div id="mensaje" class="mb-3" role="status"></div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Año</th>
                            <th scope="col">Fecha de inicio</th>
                            <th scope="col">Fecha de cierre</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="text-end">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaFormularios">
                    </tbody>
                </table>
            </div>

            <hr class="my-4">

            <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                <a href="../menu/" class="btn btn-secondary">
                    Volver al menú
                </a>

                <button type="button" id="botonAgregar" class="btn btn-success" disabled>
                    + Agregar formulario
                </button>
            </div>

        </div>
    </main>
    <!-- Protección de la página -->
    <script type="module">
        import { protegerPagina } from "../js/auth.js";

        protegerPagina();
    </script>
    <script type="module" src="../JS/formularios/formularios.js"></script>
</body>

</html>
