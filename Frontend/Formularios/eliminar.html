<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">
            <img src="../IMG/banner.jpg" alt="Banner principal" class="banner img-fluid">

            <h2 class="mb-3">Eliminar formulario</h2>
            <hr>

            <p class="text-secondary mb-4">
                Revisá los datos del formulario antes de confirmar su eliminación.
            </p>

            <div id="mensaje" class="mb-3" role="alert" hidden></div>

            <div id="datosFormulario" hidden>
                <div class="mb-3">
                    <label class="form-label">Año</label>
                    <input type="text" id="anio" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de inicio</label>
                    <input type="text" id="fechaInicio" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de cierre</label>
                    <input type="text" id="fechaCierre" class="form-control" readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label">Estado</label>
                    <input type="text" id="estado" class="form-control" readonly>
                </div>

                <div class="alert alert-warning" role="alert">
                    ¿Estás seguro de que querés eliminar este formulario? Esta acción no se puede deshacer.
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                    <a href="./index.html" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="button" id="botonEliminar" class="btn btn-danger">
                        Eliminar formulario
                    </button>
                </div>
            </div>

            <div id="accionesError" class="mt-3" hidden>
                <a href="./index.html" class="btn btn-secondary">
                    Volver al listado
                </a>
            </div>
        </div>
    </main>
    <!-- Protección de la página -->
    <script type="module">
        import { protegerPagina } from "../js/auth.js";

        protegerPagina();
    </script>
    <script type="module" src="../JS/formularios/eliminar.js"></script>
</body>

</html>
