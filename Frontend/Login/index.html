<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS global -->
    <link rel="stylesheet" href="../CSS/global.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="./login.css">
</head>

<body class="login-page">
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="form-container">
            <img src="../img/banner.jpg" alt="Banner principal" class="banner img-fluid">
            <form id="loginForm">
                <h2 class="mb-3">Iniciar Sesión</h2>
                <hr>
                <p class="text-secondary mb-4">Completar todos los campos solicitados.</p>
                <h3 class="h5 text-start mb-3">🛃 Datos de acceso</h3>
                <hr class="mb-4">
                <div class="mb-3 text-start">
                    <label for="loginUser" class="form-label">Nombre de usuario:</label>
                    <input type="text" class="form-control" id="loginUser" name="usuario"
                        placeholder="Ingrese un usuario." autocomplete="username" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="loginPassword" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="loginPassword" name="password"
                        placeholder="Ingrese una contraseña." autocomplete="current-password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" id="login" class="btn btn-success">
                        Ingresar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="./login.js">
    </script>

</body>

</html>
