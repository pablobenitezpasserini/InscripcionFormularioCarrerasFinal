<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de inscripciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../Listado/listado.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">

            <img src="../IMG/banner.jpg" alt="Banner principal" class="banner">

            <h2 class="titulo-listado">Listado de inscripciones</h2>

            <p class="descripcion-listado">
                Consulta de las inscripciones registradas en el sistema.
            </p>

            <div class="barra-herramientas">
                <div class="buscador-container">
                    <i class="bi bi-search"></i>
                    <input type="search" id="busqueda" placeholder="Buscar inscripción..."
                        aria-label="Buscar inscripción">
                </div>

                <span id="cantidadRegistros" class="cantidad-registros">
                    Registros: 0
                </span>

                <button type="button" id="botonExportar" class="btn btn-success">
                    <i class="bi bi-file-earmark-excel"></i>
                    Exportar a Excel
                </button>
            </div>

            <div id="mensaje" class="mb-3" role="status"></div>

            <div class="planilla-container">
                <table class="tabla-inscripciones">
                    <thead>
                        <tr>
                            <th>Marca temporal</th>
                            <th>Correo electrónico</th>
                            <th>Carrera inscripta</th>
                            <th>Nombre y apellido</th>
                            <th>DNI</th>
                            <th>Teléfono</th>
                            <th>Fecha de nacimiento</th>
                            <th>Edad al 30/06</th>
                            <th>Dirección</th>
                            <th>Posee</th>
                            <th>Título secundario</th>
                            <th>Año de egreso</th>
                        </tr>
                    </thead>

                    <tbody id="tablaEstudiantes">
                        <!-- Las inscripciones se cargarán con JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="pie-listado">
                <a href="../menu/" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Volver al menú
                </a>
            </div>

        </div>
    </main>
    <!-- Protección de la página -->
    <script type="module">
        import { protegerPagina } from "../js/auth.js";

        protegerPagina();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script type="module" src="./listado.js"></script>
</body>

</html>
