<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear administrador</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../CSS/global.css">

    <!-- Estilos específicos -->
    <link rel="stylesheet" href="../CSS/administradores/crear.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">

            <!-- Banner -->
            <img
                src="../img/banner.jpg"
                alt="Banner principal"
                class="banner img-fluid"
            >

            <h2>Crear administrador</h2>

            <hr>

            <p class="text-secondary mb-4">
                Complete todos los campos para registrar un administrador.
            </p>

            <!-- Formulario -->
            <form id="crearAdminForm">

                <div class="mb-3 text-start">
                    <label for="nombreApellido" class="form-label">
                        Nombre y apellido:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombreApellido"
                        name="Admin_Nom_Ape"
                        placeholder="Ingrese nombre y apellido"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="tipoDni" class="form-label">
                        Tipo de documento:
                    </label>

                    <select
                        class="form-select"
                        id="tipoDni"
                        name="Admin_Tipo_DNI"
                        required
                    >
                        <option value="" selected disabled>
                            Seleccione un tipo de documento
                        </option>
                        <option value="DNI">DNI</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>

                <div class="mb-3 text-start">
                    <label for="dni" class="form-label">
                        Número de documento:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="dni"
                        name="Admin_DNI"
                        placeholder="Ingrese el número de documento"
                        required
                    >
                </div>

                <div class="mb-3 text-start">
                    <label for="nombreUsuario" class="form-label">
                        Nombre de usuario:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombreUsuario"
                        name="Admin_Nom_Usuario"
                        placeholder="Ingrese un nombre de usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4 text-start">
                    <label for="contrasena" class="form-label">
                        Contraseña:
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="contrasena"
                        name="Admin_Contra"
                        placeholder="Ingrese una contraseña"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <!-- Mensajes de respuesta -->
                <div
                    id="mensaje"
                    class="alert d-none text-start"
                    role="alert"
                ></div>

                <!-- Acciones -->
                <div class="d-flex flex-column flex-sm-row gap-2">
                    <button
                        type="submit"
                        id="crearAdmin"
                        class="btn btn-success flex-fill"
                    >
                        Registrar administrador
                    </button>

                    <a
                        href="./index.html"
                        class="btn btn-secondary flex-fill"
                    >
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </main>

    <script type="module" src="../JS/administradores/crear.js"></script>
</body>
</html>
