<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administradores</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../CSS/administradores/administradores.css">
</head>

<body>
    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-start py-4">
        <div class="form-container">

            <!-- Banner -->
            <img
                src="../IMG/banner.jpg"
                alt="Banner principal"
                class="banner img-fluid"
            >

            <h2 class="mb-3">Administradores</h2>

            <hr>

            <p class="text-secondary mb-4">
                Listado de administradores registrados en el sistema.
            </p>

            <div id="mensaje" class="mb-3" role="status"></div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Nombre y apellido</th>
                            <th scope="col">Tipo de DNI</th>
                            <th scope="col">DNI</th>
                            <th scope="col">Nombre de usuario</th>
                            <th scope="col" class="text-end">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaAdministradores">
                    </tbody>
                </table>
            </div>

            <hr class="my-4">

            <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                <a href="../menu/" class="btn btn-secondary">
                    Volver al menú
                </a>

                <a href="./crear.html" class="btn btn-success">
                    + Agregar administrador
                </a>
            </div>

        </div>
    </main>

    <script type="module" src="../JS/administradores/administradores.js"></script>
</body>
