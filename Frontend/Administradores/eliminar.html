<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/administradores/eliminar.css">
</head>

<body>

    <main class="container py-4">
        <div class="form-container mx-auto">

            <h1 class="text-center mb-4">
                Eliminar administrador
            </h1>

            <p id="datosAdministrador" class="text-center">
                Cargando datos del administrador...
            </p>

            <div id="mensaje" class="mb-3" role="alert" aria-live="polite"></div>

            <p class="text-center">
                ¿Estás seguro de que querés eliminar este administrador?
            </p>

            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <button type="button" id="botonEliminar" class="btn btn-danger">
                    Confirmar eliminación
                </button>

                <a href="./index.html" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

        </div>
    </main>
    <!-- Protección de la página -->
    <script type="module">
        import { protegerPagina } from "../js/auth.js";

        protegerPagina();
    </script>
    <script type="module" src="../JS/administradores/eliminar.js"></script>
</body>

</html>
